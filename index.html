<script>

let live={k:0,kp:0,u:0,up:0,y10:0,y10p:0,y2:0,y2p:0};

// Yahoo 프록시 호출 (안정화)
async function fetchData(url){
  try{
    const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,{cache:"no-store"});
    const d=await r.json();
    if(!d||!d.contents||d.contents.includes("<html")) throw "bad";
    return JSON.parse(d.contents);
  }catch{ return null; }
}

function cacheSet(id,val){ localStorage.setItem("cache_"+id,val); }
function cacheGet(id){ return localStorage.getItem("cache_"+id); }

function formatChange(c,p,id){
  if(!p) return;
  const diff=c-p, pct=(diff/p*100).toFixed(2);
  const sign=diff>0?"▲":diff<0?"▼":"";
  const cls=diff>0?"up":diff<0?"down":"";
  const el=document.getElementById(id+"-c");
  if(el) el.innerHTML=`<span class="${cls}">${sign} ${Math.abs(diff).toFixed(2)} (${pct}%)</span>`;
}

async function getYahoo(ticker,id){
  const data=await fetchData(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1m&range=1d`);
  const el=document.getElementById(id);
  if(!data||!data.chart||!data.chart.result){
    const c=cacheGet(id);
    if(el&&c){ el.innerText=c; el.classList.add("faded"); }
    else if(el) el.innerText="N/A";
    return;
  }
  const meta=data.chart.result[0].meta;
  const cur=meta.regularMarketPrice, prev=meta.previousClose;
  let v=cur.toFixed(2);
