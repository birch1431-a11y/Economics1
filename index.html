<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔄 글로벌 경제 상황판</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 8px; }
        .hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
        .category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; } 
        .val-container { text-align: right; }
        .value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
        .change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
        .up { color: #ff4444; } .down { color: #4488ff; }
        .status-danger { color: #ff4444 !important; } 
        .status-warning { color: #ffbb33 !important; } 
        .status-safe { color: #00ff88 !important; }
        .footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="header" onclick="location.reload()">🔄 글로벌 경제 상황판</div>

    <!-- 생략: 기존 HTML 그대로 유지 (외환, 증시, 국채, 원자재, 가상자산, 심리/밸류) -->

    <div class="footer-copy">2026 Developed by <span style="color: #777; font-weight: 500;">S.K. Chun</span></div>
    <div id="status-msg" style="text-align:center; font-size:0.7rem; color:#555; margin-bottom:30px;">데이터 연결 중...</div>

    <script>
        const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341";
        const BASE_US_MCAP = 62.5; 
        const BASE_KR_MCAP = 4660; 
        let live = { k:0, kp:0, u:0, up:0, y10:0, y10p:0, y2:0, y2p:0 };

        function formatChange(c, p, id) {
            const diff = c - p, pct = (diff/p*100).toFixed(2);
            const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "";
            const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
            const cEl = document.getElementById(id + "-c");
            if(cEl) cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})} (${pct}%)</span>`;
        }

        async function fetchTData(symbol, id){
            try{
                const res = await fetch(`https://api.twelvedata.com/quote?symbol=${symbol}&apikey=${MY_API_KEY}`);
                const d = await res.json();
                if(d && d.close){
                    const c=parseFloat(d.close), p=parseFloat(d.previous_close);
                    const el=document.getElementById(id);
                    if(el){
                        if(id==="XRP") el.innerText=c.toFixed(4);
                        else el.innerText=c.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
                        formatChange(c,p,id);
                        if(id==="USD/KRW"){ live.u=c; live.up=p; updateKospiUsd(); }
                        if(id==="KOSPI"){ live.k=c; live.kp=p; updateKrMcap(c,p); updateKospiUsd(); }
                        if(id==="US10Y"){ live.y10=c; live.y10p=p; updateSpread(); }
                        if(id==="US2Y"){ live.y2=c; live.y2p=p; updateSpread(); }
                        if(id==="VTI") updateUsMcap(c,p);
                    }
                }
            }catch(e){ console.error(id + " 로드 실패"); }
        }

        function updateUsMcap(c,p){
            const m=BASE_US_MCAP*(c/p);
            const el=document.getElementById("US_MCAP");
            if(el){ el.innerText=m.toFixed(2); formatChange(m,BASE_US_MCAP,"US_MCAP");
                const bft=(m/27.94*100).toFixed(1);
                const bEl=document.getElementById("BUFFETT");
                if(bEl){ bEl.innerText=bft+"%"; bEl.className="value "+(bft>=150?"status-danger":bft>=120?"status-warning":"status-safe"); }
            }
        }

        function updateKrMcap(c,p){
            const m=BASE_KR_MCAP*(c/p);
            const el=document.getElementById("KR_MCAP");
            if(el){ el.innerText=Math.floor(m).toLocaleString(); formatChange(m,BASE_KR_MCAP,"KR_MCAP"); }
        }

        function updateKospiUsd(){
            if(live.k && live.u){
                const c=live.k/live.u, p=live.kp/live.up;
                const el=document.getElementById("KOSPI_USD");
                if(el){ el.innerText=c.toFixed(2); formatChange(c,p,"KOSPI_USD"); }
            }
        }

        function updateSpread(){
            if(live.y10 && live.y2){
                const s=live.y10-live.y2, sp=live.y10p-live.y2p;
                const el=document.getElementById("SPREAD");
                if(el){ el.innerText=s.toFixed(2)+"%p"; formatChange(s,sp,"SPREAD"); el.className="value "+(s<0?"status-danger":"status-safe"); }
            }
        }

        async function init(){
            // Twelve Data API 아이템 배열 그대로
            const tdata_items=[
                {s:"USD/KRW", id:"USD/KRW"}, {s:"JPY/KRW", id:"JPY/KRW"}, {s:"EUR/KRW", id:"EUR/KRW"}, {s:"CNY/KRW", id:"CNY/KRW"},
                {s:"BTC/USD", id:"BTC"}, {s:"ETH/USD", id:"ETH"}, {s:"XRP/USD", id:"XRP"},
                {s:"VTI", id:"VTI"}, {s:"^GSPC", id:"SP500"}, {s:"^IXIC", id:"NASDAQ"}, {s:"^DJI", id:"DOW"},
                {s:"^KS11", id:"KOSPI"}, {s:"^KQ11", id:"KOSDAQ"}, {s:"^TYX", id:"US30Y"}, {s:"^TNX", id:"US10Y"}, {s:"^IRX", id:"US2Y"},
                {s:"GC=F", id:"GOLD"}, {s:"SI=F", id:"SILVER"}, {s:"HG=F", id:"COPPER"}, {s:"PL=F", id:"PLATINUM"}, {s:"CL=F", id:"WTI"},
                {s:"DX-Y.NYB","DXY"}
            ];

            // 병렬 fetch → 속도 최적화
            await Promise.all(tdata_items.map(item=>fetchTData(item.s,item.id)));

            // 쉴러 PER
            fetch(`https://api.twelvedata.com/quote?symbol=CAPE&apikey=${MY_API_KEY}`)
                .then(r=>r.json())
                .then(d=>{
                    if(d && d.close){
                        const v=parseFloat(d.close);
                        const el=document.getElementById("SHILLER");
                        if(el){ el.innerText=v.toFixed(1); el.className="value "+(v>=30?"status-danger":v>=20?"status-warning":"status-safe"); }
                    }
                }).catch(e=>console.error("SHILLER 로드 실패"));

            setTimeout(()=>{ document.getElementById('status-msg').innerText="최종 업데이트: "+new Date().toLocaleTimeString(); },500);
        }

        window.onload=init;
    </script>
</body>
</html>
