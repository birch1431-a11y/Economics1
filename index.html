<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔄 글로벌 경제 상황판</title>
<style>
body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
.header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 8px; }
.hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
.category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
.item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
.label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; }
.val-container { text-align: right; }
.value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
.change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
.up { color: #ff4444; } .down { color: #4488ff; }
.footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="header" onclick="location.reload()">🔄 글로벌 경제 상황판</div>

<!-- 기존 UI 그대로 유지 -->

<div id="status-msg" style="text-align:center; font-size:0.7rem; color:#555; margin-bottom:30px;">데이터 연결 중...</div>

<script>
const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341";
const FRED_API_KEY = "cbc0c68b6d198568f349a58e0e2f25b9";
const ALPHA_KEY = "NG255JZSTJEJFW4I";
const BASE_US_MCAP = 62.5;
const BASE_KR_MCAP = 4660;

let live = { k:0, kp:0, u:0, up:0, y10:0, y10p:0, y2:0, y2p:0 };

function formatChange(c,p,id){
const diff=c-p;
const pct=(diff/p*100).toFixed(2);
const sign=diff>0?"▲":diff<0?"▼":"";
const cls=diff>0?"up":diff<0?"down":"";
const el=document.getElementById(id+"-c");
if(el) el.innerHTML=`<span class="${cls}">${sign} ${Math.abs(diff).toFixed(2)} (${pct}%)</span>`;
}

async function fetchData(url){
try{
const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
const data=await res.json();
return JSON.parse(data.contents);
}catch(e){return null;}
}

async function fetchFredDirect(url){
try{
const res=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
if(res.ok) return await res.json();
}catch(e){}
return null;
}

async function fetchFredData(){
const series=[{s:"DGS30",id:"US30Y"},{s:"DGS10",id:"US10Y"},{s:"DGS2",id:"US2Y"}];
for(const item of series){
const url=`https://api.stlouisfed.org/fred/series/observations?series_id=${item.s}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=2`;
const data=await fetchFredDirect(url);
if(data && data.observations?.length>=2){
const c=parseFloat(data.observations[0].value);
const p=parseFloat(data.observations[1].value);
document.getElementById(item.id).innerText=c.toFixed(2);
formatChange(c,p,item.id);
if(item.id==="US10Y"){live.y10=c;live.y10p=p;}
if(item.id==="US2Y"){live.y2=c;live.y2p=p;}
}
}
updateCalculated();
}

async function fetchYahooData(){
const symbolMap={
"DX-Y.NYB":"DXY",
"^IXIC":"NASDAQ",
"^DJI":"DOW",
"^KQ11":"KOSDAQ",
"SI=F":"SILVER",
"HG=F":"COPPER",
"PL=F":"PLATINUM",
"CL=F":"WTI",
"^VIX":"VIX"
};
const symbols=Object.keys(symbolMap).join(',');
const url=`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols}`;
const data=await fetchData(url);
if(data?.quoteResponse?.result){
data.quoteResponse.result.forEach(q=>{
const id=symbolMap[q.symbol];
const c=q.regularMarketPrice;
const p=q.regularMarketPreviousClose;
if(id){
document.getElementById(id).innerText=c?.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
formatChange(c,p,id);
}
});
}
}

function updateCalculated(){
if(live.k && live.u){
const c=live.k/live.u;
const p=live.kp/live.up;
document.getElementById("KOSPI_USD").innerText=c.toFixed(2);
formatChange(c,p,"KOSPI_USD");
}
if(live.y10 && live.y2){
const c=live.y10-live.y2;
const p=live.y10p-live.y2p;
document.getElementById("SPREAD").innerText=c.toFixed(3);
formatChange(c,p,"SPREAD");
}
if(live.k){
const kcap=(live.k/2500)*BASE_KR_MCAP;
document.getElementById("KR_MCAP").innerText=kcap.toLocaleString(undefined,{maximumFractionDigits:0});
}
}

function updateValuations(sp){
const uscap=(sp/5000)*BASE_US_MCAP;
document.getElementById("US_MCAP").innerText=uscap.toFixed(1);
document.getElementById("BUFFETT").innerText="192% (고평가)";
document.getElementById("SHILLER").innerText="34.5";
}

async function init(){

// Twelve (8개 유지)
const twelve=[
{ s:"USD/KRW", id:"USD/KRW"},
{ s:"JPY/KRW", id:"JPY/KRW"},
{ s:"EUR/KRW", id:"EUR/KRW"},
{ s:"BTC/USD", id:"BTC"},
{ s:"ETH/USD", id:"ETH"},
{ s:"XAU/USD", id:"GOLD"},
{ s:"SPX", id:"SP500"},
{ s:"KOSPI", id:"KOSPI"}
];

for(const item of twelve){
try{
const r=await fetch(`https://api.twelvedata.com/quote?symbol=${item.s}&apikey=${MY_API_KEY}`);
const d=await r.json();
if(d?.close){
const c=parseFloat(d.close);
const p=parseFloat(d.previous_close);
document.getElementById(item.id).innerText=c.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
formatChange(c,p,item.id);
if(item.id==="USD/KRW"){live.u=c;live.up=p;}
if(item.id==="KOSPI"){live.k=c;live.kp=p;}
if(item.id==="SP500") updateValuations(c);
}
}catch(e){}
}

// Alpha
const alpha=[
{ s:"CNYKRW", id:"CNY/KRW"},
{ s:"XRPUSD", id:"XRP"}
];

for(const item of alpha){
try{
const r=await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${item.s}&apikey=${ALPHA_KEY}`);
const d=await r.json();
if(d["Global Quote"]){
const c=parseFloat(d["Global Quote"]["05. price"]);
const p=parseFloat(d["Global Quote"]["08. previous close"]);
document.getElementById(item.id).innerText=c.toFixed(item.id==="XRP"?4:2);
formatChange(c,p,item.id);
}
}catch(e){}
}

fetchFredData();
fetchYahooData();

document.getElementById("status-msg").innerText="최종 업데이트: "+new Date().toLocaleTimeString();
}

window.onload=init;
</script>
</body>
</html>
