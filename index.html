<script>
    const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341"; // Twelve Data
    const AV_API_KEY = "NG255JZSTJEJFW4I"; // Alpha Vantage
    const BASE_US_MCAP = 62.5; 
    const BASE_KR_MCAP = 4660; 
    let live = { k:0, kp:0, u:0, up:0, y10:0, y10p:0 };

    async function fetchData(url) {
        try {
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            return JSON.parse(data.contents);
        } catch (e) { return null; }
    }

    function formatChange(c, p, id) {
        const diff = c - p, pct = (diff/p*100).toFixed(2);
        const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "";
        const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
        const cEl = document.getElementById(id + "-c");
        if(cEl) {
            cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} (${pct}%)</span>`;
        }
    }

    function updateKrMcap(c, p) {
        const m = BASE_KR_MCAP * (c/p);
        const el = document.getElementById("KR_MCAP");
        if(el) { el.innerText = Math.floor(m).toLocaleString(); formatChange(m, BASE_KR_MCAP, "KR_MCAP"); }
    }

    function updateKospiUsd() {
        if(live.k && live.u) {
            const c = live.k/live.u, p = live.kp/live.up;
            const el = document.getElementById("KOSPI_USD");
            if(el) { el.innerText = c.toFixed(2); formatChange(c, p, "KOSPI_USD"); }
        }
    }

    function updateSpread() {
        if(live.y10 && live.y2) {
            const s = live.y10-live.y2, sp = live.y10p-live.y2p;
            const el = document.getElementById("SPREAD");
            if(el) { 
                el.innerText = s.toFixed(2) + "%p"; 
                formatChange(s, sp, "SPREAD"); 
                el.className = "value " + (s<0?"status-danger":"status-safe"); 
            }
        }
    }

    async function init() {
        const tdata_items = [
            {s:"USD/KRW", id:"USD/KRW"}, {s:"JPY/KRW", id:"JPY/KRW"}, 
            {s:"EUR/KRW", id:"EUR/KRW"}, {s:"CNY/KRW", id:"CNY/KRW"},
            {s:"BTC/USD", id:"BTC"}, {s:"ETH/USD", id:"ETH"}, {s:"XRP/USD", id:"XRP"},
            {s:"GOLD", id:"GOLD"}, {s:"SILVER", id:"SILVER"}, {s:"COPPER", id:"COPPER"},
            {s:"PLATINUM", id:"PLATINUM"}, {s:"WTI", id:"WTI"}, {s:"VIXY", id:"VIX"}
        ];

        // Twelve Data 우선 7~8개 지표만 fetch (핵심 지표)
        for (const item of tdata_items.slice(0,8)) {
            fetch(`https://api.twelvedata.com/quote?symbol=${item.s}&apikey=${MY_API_KEY}`)
            .then(r=>r.json()).then(d=>{
                if(d && d.close){
                    const c=parseFloat(d.close), p=parseFloat(d.previous_close);
                    const el = document.getElementById(item.id);
                    if(el) {
                        if(item.id === "XRP") el.innerText = c.toFixed(4);
                        else el.innerText = c.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
                        formatChange(c, p, item.id);
                        if(item.id === "USD/KRW"){ live.u=c; live.up=p; updateKospiUsd(); }
                    }
                }
            }).catch(e => console.error(item.id + " 로드 실패"));
            await new Promise(r => setTimeout(r, 800));
        }

        // Alpha Vantage → 부족 지표만 fetch (추후 연결)
        // 예: US10Y, S&P500 등

        setTimeout(()=>{ document.getElementById('status-msg').innerText = "최종 업데이트: " + new Date().toLocaleTimeString(); }, 3000);
    }

    window.
