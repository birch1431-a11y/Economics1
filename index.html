<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> 글로벌 경제 상황판</title>
<style>
body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
.header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 8px; }
.hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
.category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
.item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
.label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; }
.val-container { text-align: right; }
.value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
.change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
.up { color: #ff4444; } .down { color: #4488ff; }
.footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="header">글로벌 경제 상황판</div>

<!-- HTML 부분은 절대 변경 없음 -->
<!-- (원본 그대로 유지) -->

<script>
const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341";
const FRED_API_KEY = "cbc0c68b6d198568f349a58e0e2f25b9";
const BASE_US_MCAP = 62.5; 
const BASE_KR_MCAP = 4660; 
let live = { k:0, kp:0, u:0, up:0, y10:0, y10p:0, y2:0, y2p:0 };

async function fetchData(url) {
    try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        return JSON.parse(data.contents);
    } catch (e) { return null; }
}

async function fetchFredDirect(url) {
    try {
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        if (res.ok) return await res.json();
        return null;
    } catch (e) { return null; }
}

function formatChange(c, p, id) {
    const diff = c - p, pct = (diff/p*100).toFixed(2);
    const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "";
    const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
    const cEl = document.getElementById(id + "-c");
    if(cEl) {
        cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} (${pct}%)</span>`;
    }
}

async function fetchFredData() {

    const fredSeries = [
        {s:"DGS30", id:"US30Y"},
        {s:"DGS10", id:"US10Y"},
        {s:"DGS2", id:"US2Y"},
        {s:"SP500", id:"SP500"}   // 🔵 S&P500 추가
    ];

    for (const item of fredSeries) {
        try {
            const url = `https://api.stlouisfed.org/fred/series/observations?series_id=${item.s}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=2`;
            const data = await fetchFredDirect(url);

            if (data && data.observations && data.observations.length >= 2) {

                const c = parseFloat(data.observations[0].value);
                const p = parseFloat(data.observations[1].value);

                const el = document.getElementById(item.id);
                if (el && !isNaN(c)) {

                    el.innerText = c.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                    formatChange(c, p, item.id);

                    if(item.id === "US10Y") { live.y10 = c; live.y10p = p; }
                    if(item.id === "US2Y") { live.y2 = c; live.y2p = p; }

                    // 🔵 기존 밸류 계산 연결 유지
                    if(item.id === "SP500") { updateValuations(c); }
                }
            }
        } catch (e) {}
    }

    updateCalculated();
}

async function fetchYahooData() {

    // 🔵 SP500 제거 (나머지는 그대로 유지)
    const symbolMap = {
        "DX-Y.NYB": "DXY",
        "^IXIC": "NASDAQ", 
        "^DJI": "DOW",
        "^KS11": "KOSPI",
        "^KQ11": "KOSDAQ",
        "SI=F": "SILVER",
        "HG=F": "COPPER",
        "PL=F": "PLATINUM",
        "CL=F": "WTI",
        "^VIX": "VIX"
    };

    const symbols = Object.keys(symbolMap).join(',');

    try {
        const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols}`;
        const data = await fetchData(url);

        if (data && data.quoteResponse && data.quoteResponse.result) {
            data.quoteResponse.result.forEach(quote => {

                const targetId = symbolMap[quote.symbol];
                if (targetId) {

                    const c = quote.regularMarketPrice;
                    const p = quote.regularMarketPreviousClose;

                    const el = document.getElementById(targetId);
                    if (el) {
                        el.innerText = c.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                        formatChange(c, p, targetId);
                    }

                    if(targetId === "KOSPI") { live.k = c; live.kp = p; }
                }
            });

            updateCalculated();
        }
    } catch (e) {}
}

function updateCalculated() {
    if(live.k && live.u) {
        const c = live.k / live.u, p = live.kp / live.up;
        const el = document.getElementById("KOSPI_USD");
        if(el) { el.innerText = c.toFixed(2); formatChange(c, p, "KOSPI_USD"); }
    }

    if(live.y10 && live.y2) {
        const c = live.y10 - live.y2, p = live.y10p - live.y2p;
        const el = document.getElementById("SPREAD");
        if(el) { el.innerText = c.toFixed(3); formatChange(c, p, "SPREAD"); }
    }

    if(live.k) {
        const kcap = (live.k / 2500) * BASE_KR_MCAP;
        const el = document.getElementById("KR_MCAP");
        if(el) el.innerText = kcap.toLocaleString(undefined, {maximumFractionDigits:0});
    }
}

function updateValuations(sp500) {
    const uscap = (sp500 / 5000) * BASE_US_MCAP;
    const el = document.getElementById("US_MCAP");
    if(el) el.innerText = uscap.toFixed(1);

    document.getElementById("BUFFETT").innerText = "192% (고평가)";
    document.getElementById("SHILLER").innerText = "34.5";
}

async function init() {

    const tdata_items = [
        {s:"USD/KRW", id:"USD/KRW"},
        {s:"JPY/KRW", id:"JPY/KRW"}, 
        {s:"EUR/KRW", id:"EUR/KRW"},
        {s:"CNY/KRW", id:"CNY/KRW"},
        {s:"BTC/USD", id:"BTC"},
        {s:"ETH/USD", id:"ETH"},
        {s:"XRP/USD", id:"XRP"},
        {s:"XAU/USD", id:"GOLD"}
    ];

    await Promise.all(tdata_items.map(async item => {
        try {
            const r = await fetch(`https://api.twelvedata.com/quote?symbol=${item.s}&apikey=${MY_API_KEY}`);
            const d = await r.json();
            if(d && d.close){
                const c=parseFloat(d.close), p=parseFloat(d.previous_close);
                const el = document.getElementById(item.id);
                if(el) {
                    if(item.id === "XRP") el.innerText = c.toFixed(4);
                    else el.innerText = c.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
                    formatChange(c, p, item.id);
                    if(item.id === "USD/KRW"){ live.u=c; live.up=p; updateCalculated(); }
                }
            }
        } catch(e){}
    }));

    fetchFredData();
    fetchYahooData();

    setTimeout(()=>{ 
        document.getElementById('status-msg').innerText = 
        "최종 업데이트: " + new Date().toLocaleTimeString(); 
    }, 1000);
}

window.onload = init;
</script>
</body>
</html>
