<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔄 글로벌 경제 상황판 (Stable)</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 8px; }
        .hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
        .category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .label { font-size: 0.95rem; color: #bbbbbb; } 
        .val-container { text-align: right; }
        .value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
        .change { font-size: 0.75rem; margin-top: 2px; }
        .up { color: #ff4444; } .down { color: #4488ff; }
        .status-danger { color: #ff4444 !important; } .status-warning { color: #ffbb33 !important; } .status-safe { color: #00ff88 !important; }
        .footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="header" onclick="location.reload()">🔄 글로벌 경제 상황판</div>

    <div class="category">외환</div><hr class="hr-short">
    <div id="fx-section">
        <div class="item-row"><span class="label">달러지수</span><div class="val-container"><span class="value" id="DXY">--</span><div class="change" id="DXY-c">--</div></div></div>
        <div class="item-row"><span class="label">원/달러</span><div class="val-container"><span class="value" id="USD/KRW">--</span><div class="change" id="USD/KRW-c">--</div></div></div>
    </div>

    <div class="category">주요 증시지표</div><hr class="hr-short">
    <div class="item-row"><span class="label">S&P 500</span><div class="val-container"><span class="value" id="SP500">--</span><div class="change" id="SP500-c">--</div></div></div>
    <div class="item-row"><span class="label">KOSPI</span><div class="val-container"><span class="value" id="KOSPI">--</span><div class="change" id="KOSPI-c">--</div></div></div>

    <div class="category">시장 심리 및 금리</div><hr class="hr-short">
    <div class="item-row"><span class="label">VIX 지수 (참값)</span><div class="val-container"><span class="value" id="VIX">--</span><div class="change" id="VIX-c">--</div></div></div>
    <div class="item-row"><span class="label">미 10년물 금리</span><div class="val-container"><span class="value" id="US10Y">--</span><div class="change" id="US10Y-c">--</div></div></div>
    <div class="item-row"><span class="label">실제 연방금리 (AV)</span><div class="val-container"><span class="value" id="FED_RATE">--</span></div></div>

    <div class="footer-copy">2026 Developed by S.K. Chun</div>
    <div id="status-msg" style="text-align:center; font-size:0.7rem; color:#555; margin-bottom:30px;">데이터 로드 중...</div>

    <script>
        const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341"; // Twelve Data
        const AV_KEY = "NG255JZSTJEJFW4I"; // Alpha Vantage

        async function fetchYahoo(ticker, id) {
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1m&range=1d')}`);
                const json = await res.json();
                const data = JSON.parse(json.contents);
                const meta = data.chart.result[0].meta;
                const cur = meta.regularMarketPrice;
                const prev = meta.previousClose;
                
                document.getElementById(id).innerText = cur.toLocaleString(undefined, {minimumFractionDigits:2});
                updateChange(id, cur, prev);
                if(id === "VIX") document.getElementById(id).className = "value " + (cur >= 25 ? "status-danger" : "status-safe");
            } catch(e) { console.log(id + " load fail"); }
        }

        function updateChange(id, c, p) {
            const diff = c - p, pct = (diff/p*100).toFixed(2);
            const cls = diff > 0 ? "up" : "down";
            document.getElementById(id + "-c").innerHTML = `<span class="${cls}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(2)} (${pct}%)</span>`;
        }

        async function fetchAV_FedRate() {
            try {
                const res = await fetch(`https://www.alphavantage.co/query?function=FEDERAL_FUNDS_RATE&interval=daily&apikey=${AV_KEY}`);
                const d = await res.json();
                if(d.data && d.data[0]) {
                    document.getElementById("FED_RATE").innerText = d.data[0].value + "%";
                }
            } catch(e) { console.log("AV load fail"); }
        }

        async function init() {
            // 야후 지수들 (VIX 포함)
            await fetchYahoo("^GSPC", "SP500");
            await fetchYahoo("^KS11", "KOSPI");
            await fetchYahoo("^VIX", "VIX");
            await fetchYahoo("^TNX", "US10Y");
            await fetchYahoo("DX-Y.NYB", "DXY");

            // 알파벤티지 (안정성을 위해 지연 후 호출)
            setTimeout(fetchAV_FedRate, 2000);

            document.getElementById('status-msg').innerText = "업데이트 완료: " + new Date().toLocaleTimeString();
        }

        window.onload = init;
    </script>
</body>
</html>
