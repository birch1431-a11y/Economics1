<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔄 글로벌 경제 상황판 (핵심 12개 지표)</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 8px; }
        .hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
        .category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; } 
        .val-container { text-align: right; }
        .value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
        .change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
        .up { color: #ff4444; } .down { color: #4488ff; }
        .status-msg { text-align:center; font-size:0.7rem; color:#c5a059; margin-top:20px; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="header" onclick="location.reload()">🔄 글로벌 경제 상황판</div>

    <div class="category">핵심 실시간 지표 (Twelve Data)</div><hr class="hr-short">
    <div class="item-row"><span class="label">S&P 500</span><div class="val-container"><span class="value" id="SP500">--</span><div class="change" id="SP500-c">--</div></div></div>
    <div class="item-row"><span class="label">NASDAQ</span><div class="val-container"><span class="value" id="NASDAQ">--</span><div class="change" id="NASDAQ-c">--</div></div></div>
    <div class="item-row"><span class="label">KOSPI</span><div class="val-container"><span class="value" id="KOSPI">--</span><div class="change" id="KOSPI-c">--</div></div></div>
    <div class="item-row"><span class="label">KOSDAQ</span><div class="val-container"><span class="value" id="KOSDAQ">--</span><div class="change" id="KOSDAQ-c">--</div></div></div>
    <div class="item-row"><span class="label">원/달러 환율</span><div class="val-container"><span class="value" id="USD/KRW">--</span><div class="change" id="USD/KRW-c">--</div></div></div>
    <div class="item-row"><span class="label">원/엔 환율</span><div class="val-container"><span class="value" id="JPY/KRW">--</span><div class="change" id="JPY/KRW-c">--</div></div></div>
    <div class="item-row"><span class="label">금 ($/oz)</span><div class="val-container"><span class="value" id="GOLD">--</span><div class="change" id="GOLD-c">--</div></div></div>
    <div class="item-row"><span class="label">BTC ($)</span><div class="val-container"><span class="value" id="BTC">--</span><div class="change" id="BTC-c">--</div></div></div>

    <div class="category">추가 경제 지표 (Alpha Vantage)</div><hr class="hr-short">
    <div class="item-row"><span class="label">미 10년 금리</span><div class="val-container"><span class="value" id="US10Y">--</span><div class="change" id="US10Y-c">--</div></div></div>
    <div class="item-row"><span class="label">DOW Jones</span><div class="val-container"><span class="value" id="DOW">--</span><div class="change" id="DOW-c">--</div></div></div>
    <div class="item-row"><span class="label">WTI 원유</span><div class="val-container"><span class="value" id="WTI">--</span><div class="change" id="WTI-c">--</div></div></div>
    <div class="item-row"><span class="label">원/유로 환율</span><div class="val-container"><span class="value" id="EUR/KRW">--</span><div class="change" id="EUR/KRW-c">--</div></div></div>

    <div id="status-msg" class="status-msg">중요 8개 지표 로딩 중...</div>

    <script>
        const TD_KEY = "7142915ec1dc45caad56dfc9fcf07341";
        const AV_KEY = "NG255JZSTJEJFW4I";

        function formatChange(c, p, id) {
            const diff = c - p, pct = (diff/p*100).toFixed(2);
            const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "";
            const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
            const cEl = document.getElementById(id + "-c");
            if(cEl) cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} (${pct}%)</span>`;
        }

        // Twelve Data: 요청하신 핵심 8개 집중 (분당 8개 제한 준수)
        async function fetchTD(symbol, id) {
            try {
                const res = await fetch(`https://api.twelvedata.com/quote?symbol=${symbol}&apikey=${TD_KEY}`);
                const d = await res.json();
                if(d.close) {
                    const c = parseFloat(d.close), p = parseFloat(d.previous_close);
                    document.getElementById(id).innerText = c.toLocaleString(undefined, {minimumFractionDigits:2});
                    formatChange(c, p, id);
                }
            } catch(e) { console.error(id + " TD 실패"); }
        }

        // Alpha Vantage: 나머지 4개 (15초 간격 순차 로딩으로 차단 방지)
        async function fetchAV(symbol, id) {
            try {
                const res = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${AV_KEY}`);
                const data = await res.json();
                const q = data["Global Quote"];
                if (q && q["05. price"]) {
                    const cur = parseFloat(q["05. price"]), prev = parseFloat(q["08. previous close"]);
                    let display = cur.toLocaleString(undefined, {minimumFractionDigits:2});
                    if(id === "US10Y") display = cur.toFixed(2) + "%";
                    document.getElementById(id).innerText = display;
                    formatChange(cur, prev, id);
                    return true;
                }
            } catch(e) { return false; }
            return false;
        }

        async function init() {
            // 1. Twelve Data (8개 지표 즉시 로드)
            const td_items = [
                ["SPX", "SP500"], ["IXIC", "NASDAQ"], ["KOSPI", "KOSPI"], ["KOSDAQ", "KOSDAQ"],
                ["USD/KRW", "USD/KRW"], ["JPY/KRW", "JPY/KRW"], ["GOLD", "GOLD"], ["BTC/USD", "BTC"]
            ];
            for(let x of td_items) {
                fetchTD(x[0], x[1]);
                await new Promise(r => setTimeout(r, 800)); // 0.8초 대기
            }

            // 2. Alpha Vantage (나머지 4개 순차 로드)
            const av_items = [
                ["TNX", "US10Y"], ["DIA", "DOW"], ["USO", "WTI"], ["EUR/KRW", "EUR/KRW"]
            ];

            for(let i=0; i < av_items.length; i++) {
                document.getElementById('status-msg').innerText = `${av_items[i][1]} 업데이트 중 (15초 대기)...`;
                await fetchAV(av_items[i][0], av_items[i][1]);
                if (i < av_items.length - 1) await new Promise(r => setTimeout(r, 15000));
            }

            document.getElementById('status-msg').innerText = "최종 업데이트 완료: " + new Date().toLocaleTimeString();
        }

            window.onload = init;
    </script>
</body>
</html>
