<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 글로벌 경제 상황판</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; padding: 10px; border: 1px solid #444; border-radius: 8px; }
        .hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
        .category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; } 
        .val-container { text-align: right; }
        .value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
        .change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
        .up { color: #ff4444; } .down { color: #4488ff; }
        .footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; letter-spacing: 0.5px; }

        /* 공지사항 팝업 스타일 */
        #notice-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .notice-box {
            background: #1e1e1e; border: 1px solid #c5a059; border-radius: 12px; padding: 20px; max-width: 400px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); line-height: 1.6;
        }
        .notice-title { color: #c5a059; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .notice-content { font-size: 0.9rem; color: #ddd; margin-bottom: 20px; white-space: pre-wrap; word-break: keep-all; }
        .notice-btn {
            background: #c5a059; color: #000; border: none; padding: 12px; border-radius: 6px; width: 100%;
            font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: background 0.3s;
        }
        .notice-btn:active { background: #a38448; }
    </style>
</head>
<body>

    <div id="notice-overlay">
        <div class="notice-box">
            <div class="notice-title">경제 상황판 업데이트 안내</div>
            <div class="notice-content" id="notice-text"></div>
            <button class="notice-btn" onclick="closeNotice()">확인했습니다</button>
        </div>
    </div>

    <div class="header">글로벌 경제 상황판</div>

    <div class="category">외환</div><hr class="hr-short">
    <div class="item-row"><span class="label">원/달러</span><div class="val-container"><span class="value" id="USD/KRW">--</span><div class="change" id="USD/KRW-c">--</div></div></div>
    <div class="item-row"><span class="label">원/엔</span><div class="val-container"><span class="value" id="JPY/KRW">--</span><div class="change" id="JPY/KRW-c">--</div></div></div>

    <div class="category">주요 증시지표</div><hr class="hr-short">
    <div class="item-row"><span class="label">S&P 500(SPY 추종)</span><div class="val-container"><span class="value" id="SP500">--</span><div class="change" id="SP500-c">--</div></div></div>
    <div class="item-row"><span class="label">KOSPI(EWY 추종)</span><div class="val-container"><span class="value" id="KOSPI">--</span><div class="change" id="KOSPI-c">--</div></div></div>

    <div class="category">미국 국채 금리</div><hr class="hr-short">
    <div class="item-row"><span class="label">10Y Yield</span><div class="val-container"><span class="value" id="US10Y">--</span><div class="change" id="US10Y-c">--</div></div></div>
    <div class="item-row"><span class="label">2Y Yield</span><div class="val-container"><span class="value" id="US2Y">--</span><div class="change" id="US2Y-c">--</div></div></div>

    <div class="category">원자재</div><hr class="hr-short">
    <div class="item-row"><span class="label">금($/oz)</span><div class="val-container"><span class="value" id="GOLD">--</span><div class="change" id="GOLD-c">--</div></div></div>

    <div class="category">가상자산</div><hr class="hr-short">
    <div class="item-row"><span class="label">BTC($)</span><div class="val-container"><span class="value" id="BTC">--</span><div class="change" id="BTC-c">--</div></div></div>
    <div class="item-row"><span class="label">ETH($)</span><div class="val-container"><span class="value" id="ETH">--</span><div class="change" id="ETH-c">--</div></div></div>

    <div class="category">시장 밸류에이션 및 변동성</div><hr class="hr-short">
    <div class="item-row"><span class="label">공포지수(VXX 추종)</span><div class="val-container"><span class="value" id="VIX">--</span><div class="change" id="VIX-c">--</div></div></div>

    <div class="footer-copy">2026 Developed by <span style="color: #777; font-weight: 500;">S.K. Chun</span></div>
    <div id="status-msg" style="text-align:center; font-size:0.7rem; color:#555; margin-bottom:30px;">데이터 연결 중...</div>

    <script>
        const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341";
        const FRED_API_KEY = "cbc0c68b6d198568f349a58e0e2f25b9";

        const noticeText = `경제지표들을 가능한 많이 담고 싶었으나 무료 입수에 근본적인 한계가 있습니다.\n\n우선 데이터 제공 사이트에서는 원 데이터 제공자와의 계약관계상 제약이 있고, 기계적 방식으로 접속하는 경우 외부 공격으로 판단하여 해당 접근 경로를 차단하기도 합니다.\n(단시간내 반복적 새로고침이 문제를 악화시키므로 상황판 상단의 새로고침 기능은 삭제함)\n\n이로 인해 제공되던 데이터들이 막히는 일이 반복되고 있습니다. 따라서 부득이 제공 사이트들을 교체하고 문제가 없는 수준에서 데이터를 가져오도록 수정했습니다.\n\n또한 경제지표 중 S&P500, 코스피, VIX는 원계약자에 묶인 경우가 많아서 이에 대해서는 지수추종 ETF로 교체했습니다. 지수와 ETF는 쌍둥이처럼 움직입니다. 100만 원 움직일 때 몇백 원 정도의 미세한 오차는 있을 수 있지만, 시장이 어떤 상황인지 방향을 확인하는 데는 지장이 없습니다.`;

        function handleNotice() {
            const hasSeenNotice = localStorage.getItem('notice_closed_2026');
            if (!hasSeenNotice) {
                document.getElementById('notice-text').innerText = noticeText;
                document.getElementById('notice-overlay').style.display = 'flex';
            }
        }

        function closeNotice() {
            document.getElementById('notice-overlay').style.display = 'none';
            localStorage.setItem('notice_closed_2026', 'true');
        }

        async function fetchFredDirect(url) {
            try {
                // 더 강력한 프록시 주소로 변경
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const json = await res.json();
                    // allorigins 특유의 감싸진 데이터를 문자열에서 객체로 변환
                    return typeof json.contents === 'string' ? JSON.parse(json.contents) : json.contents;
                }
                return null;
            } catch (e) { 
                console.error("FRED Fetch Error:", e);
                return null; 
            }
        }

        function formatChange(c, p, id) {
            if(isNaN(c) || isNaN(p)) return;
            const diff = c - p, pct = (diff/p*100).toFixed(2);
            const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "";
            const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
            const cEl = document.getElementById(id + "-c");
            if(cEl) {
                cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} (${pct}%)</span>`;
            }
        }

        async function fetchFredData() {
            const fredSeries = [{s:"DGS10", id:"US10Y"}, {s:"DGS2", id:"US2Y"}];
            for (const item of fredSeries) {
                try {
                    const url = `https://api.stlouisfed.org/fred/series/observations?series_id=${item.s}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=5`;
                    const data = await fetchFredDirect(url);
                    if (data && data.observations) {
                        const obs = data.observations.filter(o => o.value !== "." && !isNaN(parseFloat(o.value)));
                        if(obs.length >= 2) {
                            const c = parseFloat(obs[0].value);
                            const p = parseFloat(obs[1].value);
                            const el = document.getElementById(item.id);
                            if (el) {
                                el.innerText = c.toFixed(2);
                                formatChange(c, p, item.id);
                            }
                        }
                    }
                } catch (e) {}
            }
        }

        async function init() {
            handleNotice();

            const tdata_items = [
                {s:"USD/KRW", id:"USD/KRW"}, {s:"JPY/KRW", id:"JPY/KRW"}, 
                {s:"SPY", id:"SP500"}, {s:"EWY", id:"KOSPI"}, {s:"VXX", id:"VIX"},
                {s:"BTC/USD", id:"BTC"}, {s:"ETH/USD", id:"ETH"},
                {s:"XAU/USD", id:"GOLD"}
            ];

            for (const item of tdata_items) {
                try {
                    const r = await fetch(`https://api.twelvedata.com/quote?symbol=${item.s}&apikey=${MY_API_KEY}`);
                    const d = await r.json();
                    if(d && d.close){
                        const c=parseFloat(d.close), p=parseFloat(d.previous_close);
                        const el = document.getElementById(item.id);
                        if(el && !isNaN(c)) {
                            el.innerText = c.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
                            formatChange(c, p, item.id);
                        }
                    }
                } catch(e){}
            }

            // 트웰브데이터 로딩 후 국채 금리 실행
            fetchFredData();

            setTimeout(()=>{ document.getElementById('status-msg').innerText = "최종 업데이트: " + new Date().toLocaleTimeString(); }, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
