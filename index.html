<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔄 글로벌 경제 상황판</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 8px; }
        .hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
        .category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; } 
        .val-container { text-align: right; }
        .value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
        .change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
        .up { color: #ff4444; } .down { color: #4488ff; }
        .footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="header" onclick="location.reload()">🔄 글로벌 경제 상황판</div>

    <div class="category">외환</div><hr class="hr-short">
    <div class="item-row"><span class="label">달러지수</span><div class="val-container"><span class="value" id="DXY">--</span><div class="change" id="DXY-c">--</div></div></div>
    <div class="item-row"><span class="label">원/달러</span><div class="val-container"><span class="value" id="USD/KRW">--</span><div class="change" id="USD/KRW-c">--</div></div></div>
    <div class="item-row"><span class="label">원/엔</span><div class="val-container"><span class="value" id="JPY/KRW">--</span><div class="change" id="JPY/KRW-c">--</div></div></div>
    <div class="item-row"><span class="label">원/유로</span><div class="val-container"><span class="value" id="EUR/KRW">--</span><div class="change" id="EUR/KRW-c">--</div></div></div>

    <div class="category">주요 증시지표</div><hr class="hr-short">
    <div class="item-row"><span class="label">S&P 500</span><div class="val-container"><span class="value" id="SP500">--</span><div class="change" id="SP500-c">--</div></div></div>
    <div class="item-row"><span class="label">NASDAQ</span><div class="val-container"><span class="value" id="NASDAQ">--</span><div class="change" id="NASDAQ-c">--</div></div></div>
    <div class="item-row"><span class="label">DOW</span><div class="val-container"><span class="value" id="DOW">--</span><div class="change" id="DOW-c">--</div></div></div>
    <div class="item-row"><span class="label">달러환산 KOSPI</span><div class="val-container"><span class="value" id="KOSPI_USD">--</span><div class="change" id="KOSPI_USD-c">--</div></div></div>

    <div class="category">원자재 및 심리</div><hr class="hr-short">
    <div class="item-row"><span class="label">금($/oz)</span><div class="val-container"><span class="value" id="GOLD">--</span><div class="change" id="GOLD-c">--</div></div></div>
    <div class="item-row"><span class="label">VIX (공포지수)</span><div class="val-container"><span class="value" id="VIX">--</span><div class="change" id="VIX-c">--</div></div></div>

    <div class="category">가상자산</div><hr class="hr-short">
    <div class="item-row"><span class="label">BTC($)</span><div class="val-container"><span class="value" id="BTC">--</span><div class="change" id="BTC-c">--</div></div></div>
    <div class="item-row"><span class="label">ETH($)</span><div class="val-container"><span class="value" id="ETH">--</span><div class="change" id="ETH-c">--</div></div></div>
    <div class="item-row"><span class="label">XRP($)</span><div class="val-container"><span class="value" id="XRP">--</span><div class="change" id="XRP-c">--</div></div></div>

    <div class="footer-copy">2026 Developed by <span style="color: #777; font-weight: 500;">S.K. Chun</span></div>
    <div id="status-msg" style="text-align:center; font-size:0.7rem; color:#555; margin-bottom:30px;">데이터 연결 중...</div>

    <script>
        const T_KEY = "7142915ec1dc45caad56dfc9fcf07341"; // Twelve Data
        const F_KEY = "d6acr49r01qqjvbq041gd6acr49r01qqjvbq0420"; // Finnhub
        
        let live = { u:0, up:0 }; // 환율 데이터 저장용

        function formatChange(c, p, id) {
            const diff = c - p, pct = (diff/p*100).toFixed(2);
            const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "";
            const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
            const cEl = document.getElementById(id + "-c");
            if(cEl) {
                cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} (${pct}%)</span>`;
            }
        }

        // Finnhub 호출 함수 (추가됨)
        async function fetchFinnhub() {
            const items = [
                { s: "^GSPC", id: "SP500" },
                { s: "^IXIC", id: "NASDAQ" },
                { s: "^DJI", id: "DOW" },
                { s: "^VIX", id: "VIX" }
            ];

            for (let i = 0; i < items.length; i++) {
                setTimeout(async () => {
                    try {
                        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${items[i].s}&token=${F_KEY}`);
                        const d = await res.json();
                        if (d && d.c) {
                            const c = parseFloat(d.c), p = parseFloat(d.pc);
                            document.getElementById(items[i].id).innerText = c.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                            formatChange(c, p, items[i].id);
                        }
                    } catch (e) { console.error(items[i].id + " 로드 실패"); }
                }, i * 500); // 0.5초 간격으로 순차 호출
            }
        }

        async function init() {
            // Twelve Data 항목 (8종 고정)
            const t_items = [
                {s:"USD/KRW", id:"USD/KRW"}, {s:"JPY/KRW", id:"JPY/KRW"}, 
                {s:"EUR/KRW", id:"EUR/KRW"}, {s:"CNY/KRW", id:"CNY/KRW"},
                {s:"BTC/USD", id:"BTC"}, {s:"ETH/USD", id:"ETH"}, 
                {s:"XRP/USD", id:"XRP"}, {s:"XAU/USD", id:"GOLD"}
            ];

            await Promise.all(t_items.map(async item => {
                try {
                    const r = await fetch(`https://api.twelvedata.com/quote?symbol=${item.s}&apikey=${T_KEY}`);
                    const d = await r.json();
                    if(d && d.close){
                        const c=parseFloat(d.close), p=parseFloat(d.previous_close);
                        const el = document.getElementById(item.id);
                        if(el) {
                            el.innerText = (item.id === "XRP") ? c.toFixed(4) : c.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
                            formatChange(c, p, item.id);
                            if(item.id === "USD/KRW"){ live.u=c; live.up=p; }
                        }
                    }
                } catch(e){ console.error(item.id + " 로드 실패"); }
            }));

            document.getElementById('status-msg').innerText = "업데이트 완료: " + new Date().toLocaleTimeString();
            
            // Twelve Data 호출 완료 3초 후 Finnhub 실행
            setTimeout(fetchFinnhub, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
