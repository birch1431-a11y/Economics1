<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 글로벌 경제 상황판</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #c5a059; padding: 10px; border: 1px solid #444; border-radius: 8px; }
        .hr-short { border: 0; border-top: 2px solid #c5a059; width: 30px; margin: 5px 0 10px 0; }
        .category { margin-top: 25px; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .label { font-size: 0.95rem; color: #bbbbbb; font-weight: 400; } 
        .val-container { text-align: right; }
        .value { font-size: 1rem; font-weight: 600; font-family: 'Roboto Mono', monospace; color: #ffffff; display: block; }
        .change { font-size: 0.75rem; font-weight: 400; margin-top: 2px; }
        .up { color: #ff4444; } .down { color: #4488ff; }
        .footer-copy { text-align: center; font-size: 0.7rem; color: #555; margin: 40px 0 10px 0; border-top: 1px solid #222; padding-top: 20px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="header">글로벌 경제 상황판</div>

    <div class="category">외환</div><hr class="hr-short">
    <div class="item-row"><span class="label">원/달러</span><div class="val-container"><span class="value" id="USD/KRW">--</span><div class="change" id="USD/KRW-c">--</div></div></div>
    <div class="item-row"><span class="label">원/엔</span><div class="val-container"><span class="value" id="JPY/KRW">--</span><div class="change" id="JPY/KRW-c">--</div></div></div>

    <div class="category">주요 증시지표</div><hr class="hr-short">
    <div class="item-row"><span class="label">S&P 500(SPY 추종)</span><div class="val-container"><span class="value" id="SP500">--</span><div class="change" id="SP500-c">--</div></div></div>
    <div class="item-row"><span class="label">KOSPI(EWY 추종)</span><div class="val-container"><span class="value" id="KOSPI">--</span><div class="change" id="KOSPI-c">--</div></div></div>

    <div class="category">미국 국채 금리</div><hr class="hr-short">
    <div class="item-row"><span class="label">10Y Yield</span><div class="val-container"><span class="value" id="US10Y">--</span><div class="change" id="US10Y-c">--</div></div></div>
    <div class="item-row"><span class="label">13W Yield</span><div class="val-container"><span class="value" id="US2Y">--</span><div class="change" id="US2Y-c">--</div></div></div>

    <div class="category">원자재</div><hr class="hr-short">
    <div class="item-row"><span class="label">금($/oz)</span><div class="val-container"><span class="value" id="GOLD">--</span><div class="change" id="GOLD-c">--</div></div></div>
    <div class="item-row"><span class="label">은($/oz)</span><div class="val-container"><span class="value" id="SILVER">--</span><div class="change" id="SILVER-c">--</div></div></div>

    <div class="category">가상자산</div><hr class="hr-short">
    <div class="item-row"><span class="label">BTC($)</span><div class="val-container"><span class="value" id="BTC">--</span><div class="change" id="BTC-c">--</div></div></div>
    <div class="item-row"><span class="label">ETH($)</span><div class="val-container"><span class="value" id="ETH">--</span><div class="change" id="ETH-c">--</div></div></div>

    <div class="category">시장 밸류에이션 및 변동성</div><hr class="hr-short">
    <div class="item-row"><span class="label">공포지수(VXX 추종)</span><div class="val-container"><span class="value" id="VIX">--</span><div class="change" id="VIX-c">--</div></div></div>

    <div class="footer-copy">2026 Developed by <span style="color: #777; font-weight: 500;">S.K. Chun</span></div>
    <div id="status-msg" style="text-align:center; font-size:0.7rem; color:#555; margin-bottom:30px;">데이터 연결 중...</div>

    <script>
        const MY_API_KEY = "7142915ec1dc45caad56dfc9fcf07341";

        function formatChange(curr, prev, id) {
            if(!curr || isNaN(curr) || !prev || isNaN(prev)) return;
            const diff = curr - prev;
            const pct = (diff / prev * 100).toFixed(2);
            const sign = diff >= 0 ? "▲" : "▼";
            const cls = diff >= 0 ? "up" : "down";
            const cEl = document.getElementById(id + "-c");
            if(cEl) {
                cEl.innerHTML = `<span class="${cls}">${sign} ${Math.abs(diff).toFixed(2)} (${pct}%)</span>`;
            }
        }

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function fetchTwelveData(item, index) {
            try {
                // 인덱스별 지연을 주되, 데이터를 받는 즉시 화면 갱신
                await sleep(index * 150);
                const r = await fetch(`https://api.twelvedata.com/quote?symbol=${item.s}&apikey=${MY_API_KEY}&_=${Date.now()}`);
                const d = await r.json();
                if(d && d.close && d.previous_close){
                    const c=parseFloat(d.close), p=parseFloat(d.previous_close);
                    document.getElementById(item.id).innerText = c.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
                    formatChange(c, p, item.id);
                }
            } catch(e){}
        }

        async function fetchExternalData(item) {
            const cacheKey = `global_macro_v2026_${item.id}`;
            const cached = JSON.parse(localStorage.getItem(cacheKey));
            const now = Date.now();
            const CACHE_TIME = 60 * 60 * 1000;

            if (cached) {
                document.getElementById(item.id).innerText = cached.close.toFixed(2);
                formatChange(cached.close, cached.prev, item.id);
                if (now - cached.timestamp < CACHE_TIME) return;
            }

            try {
                const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${item.s}?interval=1d&range=5d&_=${now}`;
                const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                const d = await r.json();
                const resObj = JSON.parse(d.contents).chart.result[0];
                
                let c = resObj.meta.regularMarketPrice;
                let p = resObj.meta.previousClose;

                if(!p && resObj.indicators.quote[0].close) {
                    const validCloses = resObj.indicators.quote[0].close.filter(v => v !== null);
                    if(validCloses.length >= 2) p = validCloses[validCloses.length - 2];
                }

                if(item.id === "US2Y" && c > 10) c /= 10;
                if(item.id === "US2Y" && p > 10) p /= 10;

                if (c && p && !isNaN(c) && !isNaN(p)) {
                    localStorage.setItem(cacheKey, JSON.stringify({ close: c, prev: p, timestamp: now }));
                    document.getElementById(item.id).innerText = c.toFixed(2);
                    formatChange(c, p, item.id);
                }
            } catch (e) {}
        }

        async function init() {
            const externalItems = [
                {s:"^IRX", id:"US2Y"}, {s:"^TNX", id:"US10Y"}, {s:"SI=F", id:"SILVER"}
            ];

            const realTimeItems = [
                {s:"USD/KRW", id:"USD/KRW"}, {s:"JPY/KRW", id:"JPY/KRW"}, 
                {s:"SPY", id:"SP500"}, {s:"EWY", id:"KOSPI"}, {s:"VXX", id:"VIX"},
                {s:"BTC/USD", id:"BTC"}, {s:"ETH/USD", id:"ETH"},
                {s:"XAU/USD", id:"GOLD"}
            ];

            // 야후 데이터 즉시 실행
            externalItems.forEach(item => fetchExternalData(item));
            
            // 트웰브데이터도 await 없이 병렬로 즉시 실행하여 하나씩 뜨게 함
            realTimeItems.forEach((item, index) => fetchTwelveData(item, index));

            // 상태 메시지는 별도로 업데이트
            setTimeout(() => {
                document.getElementById('status-msg').innerText = "데이터 업데이트 중...";
            }, 100);
        }

        window.onload = init;
    </script>
</body>
</html>
